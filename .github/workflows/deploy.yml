name: Hand Deploy

on:
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 公開用ファイルを public/ にコピー
        run: |
          mkdir -p public
          # エラーメッセージを無視して処理を続行させる
          cp pages/*.html public/ 2>/dev/null || true
          cp geojson/*.geojson public/ 2>/dev/null || true
          cp ga4Data/*.csv public/ 2>/dev/null || true
          cp ga4Data/pageviews_by_page.json public/ 2>/dev/null || true
          cp master/japan_map.csv public/ 2>/dev/null || true
          cp master/country_map.csv public/ 2>/dev/null || true
          cp master/terms.json public/ 2>/dev/null || true
          cp master/relationship.json public/ 2>/dev/null || true
          cp master/release_timeline.json public/ 2>/dev/null || true

      - name: GitHub Pagesにデプロイ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
