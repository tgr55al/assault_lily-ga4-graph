<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アサルトリリィ 作品公開順タイムライン Prototype</title>
<style>
  :root {
    --bg: #fffafb;
    --panel: #ffffff;
    --text: #4b4350;
    --muted: #8d818d;
    --line: #e7dfe7;
    --stage: #d56a9c;
    --anime: #8a70bd;
    --game: #8062ad;
    --novel: #b46f9b;
    --other: #8d858e;
    --year-height: 210px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo,
                 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 8% 10%, rgba(238,196,215,.22), transparent 22rem),
      radial-gradient(circle at 94% 82%, rgba(211,197,229,.20), transparent 24rem),
      var(--bg);
  }

  body { overflow-x: hidden; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,252,253,.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #eadfe6;
    padding: 18px 28px 14px;
    box-shadow: 0 3px 18px rgba(112,73,101,.06);
    overflow: hidden;
  }

  .topbar::before {
    content: "❀";
    position: absolute;
    left: 18px;
    top: -14px;
    font-size: 82px;
    line-height: 1;
    color: rgba(214,128,167,.12);
    transform: rotate(-12deg);
    pointer-events: none;
  }

  .topbar::after {
    content: "✦";
    position: absolute;
    right: 32px;
    bottom: 10px;
    font-size: 24px;
    color: rgba(157,112,163,.20);
    pointer-events: none;
  }

  .brand {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: baseline;
    gap: 13px;
    max-width: 1180px;
    margin: 0 auto 13px;
    padding-left: 18px;
  }

  h1 {
    margin: 0;
    color: #4c3f49;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(25px, 3vw, 34px);
    font-weight: 500;
    letter-spacing: .02em;
  }

  .brand-subtitle {
    color: #6f5e6a;
    font-size: 15px;
    letter-spacing: .14em;
    white-space: nowrap;
  }

  .brand-rule {
    position: absolute;
    left: 20px;
    right: 25%;
    bottom: -8px;
    height: 1px;
    background: linear-gradient(90deg, rgba(213,106,156,.65), rgba(213,106,156,.08), transparent);
  }

  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    max-width: 1180px;
    margin: 0 auto;
    padding-left: 18px;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid #d9cbd7;
    background: rgba(255,255,255,.92);
    color: #625666;
    border-radius: 999px;
    padding: 7px 14px 7px 11px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 2px 6px rgba(102,72,96,.04);
    transition: .15s ease;
  }

  .toggle:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(102,72,96,.10);
  }

  .toggle.active {
    color: #fff;
    border-color: transparent;
  }

  .toggle[data-type="stage"].active { background: var(--stage); }
  .toggle[data-type="anime"].active { background: var(--anime); }
  .toggle[data-type="game"].active { background: var(--game); }
  .toggle[data-type="novel"].active { background: var(--novel); }
  .toggle[data-type="other"].active { background: var(--other); }

  .toggle:not(.active) {
    color: #9b909a;
    background: #f7f3f7;
  }

  .type-icon {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 19px;
  }

  .type-icon svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hint {
    color: var(--muted);
    font-size: 11px;
    margin-left: 5px;
  }

  .viewport {
    position: relative;
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 20px 18px 70px;
  }

  .viewport::before,
  .viewport::after {
    position: absolute;
    z-index: 0;
    color: rgba(214,128,167,.12);
    font-family: Georgia, serif;
    pointer-events: none;
  }

  .viewport::before {
    content: "❀";
    left: -5px;
    top: 8px;
    font-size: 70px;
    transform: rotate(-18deg);
  }

  .viewport::after {
    content: "❀";
    right: 4px;
    bottom: 15px;
    font-size: 76px;
    transform: rotate(18deg);
  }

  .timeline {
    position: relative;
    z-index: 1;
    min-width: 880px;
    background: rgba(255,255,255,.96);
    border: 1px solid #e5dce5;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(104,76,98,.08);
  }

  .header {
    position: relative;
    z-index: 20;
    display: grid;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }

  .header > div {
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--line);
    font-weight: 800;
  }

  .header > div:last-child { border-right: 0; }

  .year-label {
    color: #a66f8d;
    font-size: 15px;
  }

  .lane-title {
    gap: 7px;
    font-size: 14px;
    letter-spacing: .04em;
  }

  .lane-title .title-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.1;
  }

  .lane-title .en {
    margin-top: 3px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .13em;
    opacity: .72;
  }

  .lane-title.stage { color: var(--stage); }
  .lane-title.anime { color: var(--anime); }
  .lane-title.game { color: var(--game); }
  .lane-title.novel { color: var(--novel); }
  .lane-title.other { color: var(--other); }

  .body {
    position: relative;
  }

  .year-row {
    position: relative;
    display: grid;
    height: var(--year-height);
    border-bottom: 1px solid #e8e1e8;
  }

  .year-row:last-child { border-bottom: 0; }

  .year {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 10px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    font-weight: 500;
    color: #a65f82;
    background: #fffafd;
    border-right: 1px solid var(--line);
  }

  .lane {
    position: relative;
    border-right: 1px solid #eee7ee;
    min-width: 0;
  }

  .month-line {
    position: absolute;
    left: 0;
    right: 0;
    border-top: 1px dashed #eee9ef;
    pointer-events: none;
  }

  .work {
    position: absolute;
    z-index: 3;
    width: min(86%, 190px);
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 9px 11px 10px;
    border: 1px solid #ddd4de;
    border-left: 4px solid var(--type-color);
    border-radius: 9px;
    background: linear-gradient(135deg,#fff,#fffafd);
    box-shadow: 0 3px 10px rgba(93,70,91,.10);
    cursor: pointer;
    text-align: left;
    transition: transform .12s, box-shadow .12s, opacity .15s;
  }

  .work:hover {
    transform: translate(-50%, -50%) scale(1.035);
    box-shadow: 0 7px 18px rgba(93,70,91,.16);
    z-index: 10;
  }

  .work-title {
    font-size: 12px;
    line-height: 1.4;
    font-weight: 800;
    color: #4e4650;
  }

  .work-date {
    margin-top: 4px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    color: #9a8d98;
    letter-spacing: .04em;
  }

  .work.stage { --type-color: var(--stage); }
  .work.anime { --type-color: var(--anime); }
  .work.game { --type-color: var(--game); }
  .work.novel { --type-color: var(--novel); }
  .work.other { --type-color: var(--other); }

  .hidden-type { display: none; }

  .legend {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 13px 4px 0;
    color: #817681;
    font-size: 11px;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,.8);
  }

  .empty {
    color: #999;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.38);
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    width: min(560px, 100%);
    max-height: 80vh;
    overflow: auto;
    background: #fffafd;
    border: 1px solid #e5d7e2;
    border-radius: 14px;
    box-shadow: 0 12px 50px rgba(84,60,80,.22);
    padding: 20px;
  }

  .modal h2 {
    margin: 0 0 8px;
    font-size: 19px;
  }

  .modal .meta {
    color: #777;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .modal .description {
    line-height: 1.7;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  .modal-actions button,
  .modal-actions a {
    display: inline-block;
    border: 0;
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
    text-decoration: none;
    font-size: 13px;
  }

  .close-btn { background: #eee; color: #333; }
  .wiki-btn { background: #333; color: #fff; }

  @media (max-width: 700px) {
    .topbar { padding: 11px 12px; }
    h1 { font-size: 18px; }
    .viewport { padding: 16px 8px 50px; overflow-x: auto; }
    .timeline { min-width: 820px; }
  }
</style>
</head>
<body>

<div class="topbar">

    <button class="toggle active" data-type="other"><span class="type-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></span><span>その他</span></button>
    <span class="hint">※ ボタンで各ラインの表示 / 非表示を切り替え</span>
  </div>
</div>

<main class="viewport">
  <div class="timeline">
    <div class="header">
      <div class="year-label">年</div>
    </div>
    <div id="body" class="body"></div>
  </div>

  <div class="legend">
    <span class="legend-item"><i class="dot" style="background:var(--stage)"></i>舞台</span>

    <span class="legend-item"><i class="dot" style="background:var(--game)"></i>ゲーム</span>

    <span class="legend-item"><i class="dot" style="background:var(--other)"></i>その他</span>
  </div>
</main>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalMeta" class="meta"></div>
    <div id="modalDescription" class="description"></div>
    <div class="modal-actions">
      <button class="close-btn" id="closeModal">閉じる</button>
      <a class="wiki-btn" id="wikiButton" target="_blank" rel="noopener">Wikiページを開く</a>
    </div>
  </div>
</div>

  stage: `<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 21c-6.4 0-9.8-4.2-7.7-8.1 1.2-2.2 4.1-3.4 6.5-2.4-1.7-2.9.3-6.2 3.6-6.2 3.1 0 4.9 3 3.6 5.8 3.4-1.2 6.3.9 6.3 4.1 0 4.4-5.2 6.8-12.3 6.8Z"/><path d="M24 20c-3.5-1.1-4.9-3.6-3.7-5.8 1-1.8 3.3-2.5 5-1.3-1.2-2.2.1-4.4 2.3-4.4 2.3 0 3.5 2.3 2.2 4.4 2-.9 4 .5 4 2.5 0 2.9-4 4.8-9.8 4.6Z"/><path d="M25 21c-.4 5.2-1.3 10.2-3.2 14.8M21.8 35.8c-2.8 1.2-5.8 2.7-8.3 5.2M24.3 28.1c-3.2-1.4-6.3-1.1-8.6.4M20.7 34.2c-2.9-2.1-5.9-2.6-8.8-1.8M26.2 25.2c4.1-.4 7.3.9 9.5 3.5M27.4 29.1c3.4-.1 6.6.9 8.9 3.3M25.8 24.5c1.9-1.9 4.3-2.7 7.1-2.3"/></g></svg>`,
  anime: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg>`,
  game: `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16.1 14.2h15.8c4.7 0 8.2 3.2 9.7 8.4l2.2 7.5c1 3.5-.8 6.8-3.8 7.4-2.3.5-4.1-.8-5.5-2.7l-3.1-4.3H16.6l-3.1 4.3c-1.4 1.9-3.2 3.2-5.5 2.7-3-.6-4.8-3.9-3.8-7.4l2.2-7.5c1.5-5.2 5-8.4 9.7-8.4Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M14 23v7M10.5 26.5h7M31.5 24.5h.01M36 28h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,

};

const START_YEAR = 2015;
const END_YEAR = 2026;
const YEAR_HEIGHT = 210;

const visible = {
  stage: true,
  anime: true,
  game: true,
  novel: true,
  other: true
};

const body = document.getElementById("body");

function dateToNumber(date) {
  const parts = date.split("-").map(Number);
  const year = parts[0];
  const month = parts[1] || 1;
  const day = parts[2] || 1;

  // その年の中での位置を 0〜1 に近似。
  const daysInYear = new Date(year, 11, 31).getDate() === 31 ? 365 : 366;
  const start = new Date(year, 0, 1);
  const current = new Date(year, month - 1, day);
  const elapsed = Math.max(0, current - start) / 86400000;

  return year + elapsed / daysInYear;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function render() {
  body.innerHTML = "";

  // 非表示にしたラインは、列そのものを生成しない。
  // そのため、作品だけでなくライン・縦線・ヘッダー列も丸ごと消えます。
  const activeTypes = TYPES.filter(type => visible[type]);

  // ヘッダーを再生成して、表示中のラインだけを残す。
  const header = document.querySelector(".header");
  header.innerHTML = "";

  const yearHeader = document.createElement("div");
  yearHeader.className = "year-label";
  yearHeader.textContent = "年";
  header.appendChild(yearHeader);

  for (const type of activeTypes) {
    const title = document.createElement("div");
    title.className = `lane-title ${type}`;
    title.innerHTML = `
      <span class="type-icon">${TYPE_ICONS[type]}</span>
      <span class="title-copy">
        <span>${TYPE_NAMES[type]}</span>
        <span class="en">${TYPE_EN[type]}</span>
      </span>
    `;
    header.appendChild(title);
  }

  // 年 + 表示中ライン数に応じて列幅を設定。
  const gridTemplate = `100px repeat(${activeTypes.length}, 1fr)`;
  header.style.gridTemplateColumns = gridTemplate;

  for (let year = START_YEAR; year <= END_YEAR; year++) {
    const row = document.createElement("div");
    row.className = "year-row";
    row.style.gridTemplateColumns = gridTemplate;

    const yearLabel = document.createElement("div");
    yearLabel.className = "year";
    yearLabel.textContent = year;
    row.appendChild(yearLabel);

    for (const type of activeTypes) {
      const lane = document.createElement("div");
      lane.className = "lane";

      // 3か月ごとの薄い補助線
      [25, 50, 75].forEach(percent => {
        const line = document.createElement("div");
        line.className = "month-line";
        line.style.top = percent + "%";
        lane.appendChild(line);
      });

      const laneWorks = works.filter(w => {
        if (w.type !== type) return false;
        const n = dateToNumber(w.date);
        return n >= year && n < year + 1;
      });

      for (const work of laneWorks) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = `work ${type}`;
        card.dataset.id = work.id;

        const n = dateToNumber(work.date);
        const percent = (n - year) * 100;

        card.style.top = percent + "%";
        card.innerHTML = `
          <div class="work-title">${escapeHtml(work.title)}</div>
          <div class="work-date">${escapeHtml(work.date)}</div>
        `;

        card.addEventListener("click", () => openModal(work));
        lane.appendChild(card);
      }

      row.appendChild(lane);
    }

    body.appendChild(row);
  }
}
function openModal(work) {
  document.getElementById("modalTitle").textContent = work.title;
  document.getElementById("modalMeta").textContent =
    `${TYPE_NAMES[work.type]} / ${work.date}`;
  document.getElementById("modalDescription").textContent =
    work.description || "";

  const wikiButton = document.getElementById("wikiButton");

  if (work.url) {
    wikiButton.href = work.url;
    wikiButton.style.display = "inline-block";
  } else {
    wikiButton.removeAttribute("href");
    wikiButton.style.display = "none";
  }

  document.getElementById("modalBackdrop").classList.add("show");
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("show");
}

document.querySelectorAll(".toggle").forEach(button => {
  button.addEventListener("click", () => {
    const type = button.dataset.type;
    visible[type] = !visible[type];
    button.classList.toggle("active", visible[type]);
    render();
  });
});

document.getElementById("closeModal").addEventListener("click", closeModal);

document.getElementById("modalBackdrop").addEventListener("click", event => {
  if (event.target.id === "modalBackdrop") closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

async function loadData() {
  try {
    const response = await fetch(DATA_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const json = await response.json();

    if (!Array.isArray(json.works)) {
      throw new Error("JSONに works 配列がありません。");
    }

    // JSON取得成功 → JSONの値を使用
    works = json.works;

    console.log(`作品データ: JSONを使用 (${works.length}件)`);
  } catch (error) {
    // JSON取得失敗 → HTML直書きデータを使用
    works = FALLBACK_WORKS;

    console.warn(
      "作品データ: HTML直書きのフォールバックを使用",
      error
    );
  }

  render();
}
loadData();
