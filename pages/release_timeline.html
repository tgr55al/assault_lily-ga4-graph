<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アサルトリリィ 作品公開順タイムライン</title>
<style>
  :root {
    --bg: #fffafb;
    --panel: #ffffff;
    --text: #4b4350;
    --muted: #8d818d;
    --line: #e7dfe7;
    --stage: #e0568f;
    --anime: #5472d3;
    --game: #2b9e8a;
    --novel: #d98a3d;
    --other: #8a8a96;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo,
                 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 8% 10%, rgba(238,196,215,.22), transparent 22rem),
      radial-gradient(circle at 94% 82%, rgba(211,197,229,.20), transparent 24rem),
      var(--bg);
  }

  body { overflow-x: hidden; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,252,253,.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #eadfe6;
    padding: 18px 28px 14px;
    box-shadow: 0 3px 18px rgba(112,73,101,.06);
    overflow: hidden;
  }

  .topbar::before {
    content: "❀";
    position: absolute;
    left: 18px;
    top: -14px;
    font-size: 82px;
    line-height: 1;
    color: rgba(214,128,167,.12);
    transform: rotate(-12deg);
    pointer-events: none;
  }

  .brand {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: baseline;
    gap: 13px;
    max-width: 1180px;
    margin: 0 auto 13px;
    padding-left: 18px;
  }

  h1 {
    margin: 0;
    color: #4c3f49;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(25px, 3vw, 34px);
    font-weight: 500;
    letter-spacing: .02em;
  }

  .brand-subtitle {
    color: #6f5e6a;
    font-size: 15px;
    letter-spacing: .14em;
    white-space: nowrap;
  }

  .brand-rule {
    position: absolute;
    left: 20px;
    right: 25%;
    bottom: -8px;
    height: 1px;
    background: linear-gradient(90deg, rgba(213,106,156,.65), rgba(213,106,156,.08), transparent);
  }

  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    max-width: 1180px;
    margin: 0 auto;
    padding-left: 18px;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid #d9cbd7;
    background: rgba(255,255,255,.92);
    color: #625666;
    border-radius: 999px;
    padding: 7px 14px 7px 11px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 2px 6px rgba(102,72,96,.04);
    transition: .15s ease;
  }

  .toggle:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(102,72,96,.10);
  }

  .toggle.active {
    color: #fff;
    border-color: transparent;
  }

  .toggle[data-type="stage"].active { background: var(--stage); }
  .toggle[data-type="anime"].active { background: var(--anime); }
  .toggle[data-type="game"].active { background: var(--game); }
  .toggle[data-type="novel"].active { background: var(--novel); }
  .toggle[data-type="other"].active { background: var(--other); }

  .toggle:not(.active) {
    color: #9b909a;
    background: #f7f3f7;
  }

  .type-icon {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 19px;
  }

  .type-icon svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hint {
    color: var(--muted);
    font-size: 11px;
    margin-left: 5px;
  }

  .viewport {
    position: relative;
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 20px 18px 70px;
  }

  .viewport::before,
  .viewport::after {
    position: absolute;
    z-index: 0;
    color: rgba(214,128,167,.12);
    font-family: Georgia, serif;
    pointer-events: none;
  }

  .viewport::before {
    content: "❀";
    left: -5px;
    top: 8px;
    font-size: 70px;
    transform: rotate(-18deg);
  }

  .viewport::after {
    content: "❀";
    right: 4px;
    bottom: 15px;
    font-size: 76px;
    transform: rotate(18deg);
  }

  .timeline {
    position: relative;
    z-index: 1;
    min-width: 880px;
    background: rgba(255,255,255,.96);
    border: 1px solid #e5dce5;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(104,76,98,.08);
  }

  .header {
    position: relative;
    z-index: 20;
    display: grid;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }

  .header > div {
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--line);
    font-weight: 800;
  }

  .header > div:last-child { border-right: 0; }

  .year-label {
    color: #a66f8d;
    font-size: 15px;
  }

  .lane-title {
    gap: 7px;
    font-size: 14px;
    letter-spacing: .04em;
  }

  .lane-title .title-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.1;
  }

  .lane-title .en {
    margin-top: 3px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .13em;
    opacity: .72;
  }

  .lane-title.stage {
    background: color-mix(in srgb, var(--stage) 18%, white);
    color: color-mix(in srgb, var(--stage) 62%, black);
  }
  .lane-title.anime {
    background: color-mix(in srgb, var(--anime) 18%, white);
    color: color-mix(in srgb, var(--anime) 62%, black);
  }
  .lane-title.game {
    background: color-mix(in srgb, var(--game) 18%, white);
    color: color-mix(in srgb, var(--game) 62%, black);
  }
  .lane-title.novel {
    background: color-mix(in srgb, var(--novel) 18%, white);
    color: color-mix(in srgb, var(--novel) 62%, black);
  }
  .lane-title.other {
    background: color-mix(in srgb, var(--other) 18%, white);
    color: color-mix(in srgb, var(--other) 62%, black);
  }

  .body {
    position: relative;
  }

  .year-row {
    position: relative;
    display: grid;
    align-items: stretch;
    min-height: 96px;
    border-bottom: 1px solid #e8e1e8;
  }

  .year-row:last-child { border-bottom: 0; }

  .year {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 18px 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    font-weight: 500;
    color: #a65f82;
    background: #fffafd;
    border-right: 1px solid var(--line);
  }

  .lane {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 10px;
    border-right: 1px solid #eee7ee;
    min-width: 0;
  }

  .work {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 210px;
    padding: 9px 11px 10px;
    border: 1px solid #ddd4de;
    border-left: 4px solid var(--type-color);
    border-radius: 9px;
    background: linear-gradient(135deg,#fff,#fffafd);
    box-shadow: 0 3px 10px rgba(93,70,91,.10);
    cursor: pointer;
    text-align: left;
    transition: transform .12s, box-shadow .12s, opacity .15s;
  }

  .work:hover {
    transform: scale(1.035);
    box-shadow: 0 7px 18px rgba(93,70,91,.16);
    z-index: 10;
  }

  .work-title {
    font-size: 12px;
    line-height: 1.4;
    font-weight: 800;
    color: #4e4650;
  }

  .work-date {
    margin-top: 4px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10px;
    color: #9a8d98;
    letter-spacing: .04em;
  }

  .work.stage { --type-color: var(--stage); }
  .work.anime { --type-color: var(--anime); }
  .work.game { --type-color: var(--game); }
  .work.novel { --type-color: var(--novel); }
  .work.other { --type-color: var(--other); }

  .hidden-type { display: none; }

  .legend {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin: 13px 4px 0;
    color: #817681;
    font-size: 11px;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px rgba(255,255,255,.8);
  }

  .empty {
    color: #999;
    text-align: center;
    padding: 60px 20px;
    font-size: 14px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.38);
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    width: min(560px, 100%);
    max-height: 80vh;
    overflow: auto;
    background: #fffafd;
    border: 1px solid #e5d7e2;
    border-radius: 14px;
    box-shadow: 0 12px 50px rgba(84,60,80,.22);
    padding: 20px;
  }

  .modal h2 {
    margin: 0 0 8px;
    font-size: 19px;
  }

  .modal .meta {
    color: #777;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .modal .description {
    line-height: 1.7;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }

  .modal-actions button,
  .modal-actions a {
    display: inline-block;
    border: 0;
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
    text-decoration: none;
    font-size: 13px;
  }

  .close-btn { background: #eee; color: #333; }
  .wiki-btn { background: #333; color: #fff; }

  @media (max-width: 700px) {
    .topbar { padding: 11px 12px; }
    h1 { font-size: 18px; }
    .viewport { padding: 16px 8px 50px; overflow-x: auto; }
    .timeline { min-width: 820px; }
  }
</style>
</head>

<div class="topbar">

    <button class="toggle active" data-type="other"><span class="type-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></span><span>その他</span></button>
    <span class="hint">※ ボタンで各ラインの表示 / 非表示を切り替え</span>
  </div>
</div>

<main class="viewport">
  <div class="timeline">
    <div class="header">
      <div class="year-label"></div>
    </div>
    <div id="body" class="body"></div>
  </div>

  <div class="legend">
    <span class="legend-item"><i class="dot" style="background:var(--stage)"></i>舞台</span>
    <span class="legend-item"><i class="dot" style="background:var(--anime)"></i>アニメ</span>
    <span class="legend-item"><i class="dot" style="background:var(--game)"></i>ゲーム</span>
    <span class="legend-item"><i class="dot" style="background:var(--novel)"></i>ノベル</span>
    <span class="legend-item"><i class="dot" style="background:var(--other)"></i>その他</span>
  </div>
</main>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalMeta" class="meta"></div>
    <div id="modalDescription" class="description"></div>
    <div class="modal-actions">
      <button class="close-btn" id="closeModal">閉じる</button>
      <a class="wiki-btn" id="wikiButton" target="_blank" rel="noopener">Wikiページを開く</a>
    </div>
  </div>
</div>

  game: `<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15h18c5.5 0 9.3 3.6 10 9.2l1.1 8.6c.6 4.3-2.6 8.2-6.9 8.2-2.6 0-4.9-1.4-6.1-3.7l-2.3-4.3H19.2l-2.3 4.3c-1.2 2.3-3.5 3.7-6.1 3.7-4.3 0-7.5-3.9-6.9-8.2l1.1-8.6C5.7 18.6 9.5 15 15 15Z"/><path d="M14.5 23.5v7M11 27h7"/><circle cx="36" cy="23" r="1.4" fill="currentColor" stroke="none"/><circle cx="40" cy="27" r="1.4" fill="currentColor" stroke="none"/><circle cx="36" cy="31" r="1.4" fill="currentColor" stroke="none"/><circle cx="32" cy="27" r="1.4" fill="currentColor" stroke="none"/></g></svg>`,
  novel: `<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 10.5c-4.2-3-9.3-3.5-15-1.7v25.8c5.7-1.8 10.8-1.3 15 1.7"/><path d="M24 10.5c4.2-3 9.3-3.5 15-1.7v25.8c-5.7-1.8-10.8-1.3-15 1.7"/><path d="M24 10.5v25.8"/><path d="M12.5 15.2c3.3-.6 6.2-.1 8.8 1.3M12.5 20.1c3.3-.6 6.2-.1 8.8 1.3M35.5 15.2c-3.3-.6-6.2-.1-8.8 1.3M35.5 20.1c-3.3-.6-6.2-.1-8.8 1.3"/></g></svg>`,

};

const visible = {
  stage: true,
  anime: true,
  game: true,
  novel: true,
  other: true
};

const body = document.getElementById("body");

function dateToNumber(date) {
  let year, month = 1, day = 1;

  if (typeof date === "string" && date.includes("年")) {
    // 「YYYY年M月D日」または「YYYY年M月」形式を解析
    const match = date.match(/(\d{4})年(?:(\d{1,2})月)?(?:(\d{1,2})日)?/);
    if (match) {
      year = parseInt(match[1], 10);
      if (match[2]) month = parseInt(match[2], 10);
      if (match[3]) day = parseInt(match[3], 10);
    }
  } else if (typeof date === "string" && date.includes("-")) {
    // 従来の「YYYY-MM-DD」形式も引き続きサポート
    const parts = date.split("-").map(Number);
    year = parts[0];
    month = parts[1] || 1;
    day = parts[2] || 1;
  } else {
    year = parseInt(date, 10);
  }

  if (!year || isNaN(year)) return 0;

  // その年の中での位置を 0〜1 に近似
  const daysInYear = new Date(year, 11, 31).getDate() === 31 ? 365 : 366;
  const start = new Date(year, 0, 1);
  const current = new Date(year, month - 1, day);
  const elapsed = Math.max(0, current - start) / 86400000;

  return year + elapsed / daysInYear;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function render() {
  body.innerHTML = "";

  // 非表示にしたラインは、列そのものを生成しない。
  // そのため、作品だけでなくライン・縦線・ヘッダー列も丸ごと消えます。
  const activeTypes = TYPES.filter(type => visible[type]);

  // ヘッダーを再生成して、表示中のラインだけを残す。
  const header = document.querySelector(".header");
  header.innerHTML = "";

  const yearHeader = document.createElement("div");
  yearHeader.className = "year-label";
  header.appendChild(yearHeader);

  for (const type of activeTypes) {
    const title = document.createElement("div");
    title.className = `lane-title ${type}`;
    title.innerHTML = `
      <span class="type-icon">${TYPE_ICONS[type]}</span>
      <span class="title-copy">
        <span>${TYPE_NAMES[type]}</span>
        <span class="en">${TYPE_EN[type]}</span>
      </span>
    `;
    header.appendChild(title);
  }

  // 年 + 表示中ライン数に応じて列幅を設定。
  const gridTemplate = `100px repeat(${activeTypes.length}, 1fr)`;
  header.style.gridTemplateColumns = gridTemplate;

  // 表示中のラインに含まれる作品だけを対象に、年の範囲を動的に決定する。
  // トグルで表示ラインを絞り込むと、その結果に合わせて年の範囲も変動する。
  const activeWorks = works.filter(w => activeTypes.includes(w.type));

  if (activeWorks.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "表示できる作品がありません。";
    body.appendChild(empty);
    return;
  }

  const activeYears = activeWorks.map(w => Math.floor(dateToNumber(w.date)));
  const startYear = Math.min(...activeYears);
  const endYear = Math.max(...activeYears);

  for (let year = startYear; year <= endYear; year++) {
    const row = document.createElement("div");
    row.className = "year-row";
    row.style.gridTemplateColumns = gridTemplate;

    const yearLabel = document.createElement("div");
    yearLabel.className = "year";
    yearLabel.textContent = year;
    row.appendChild(yearLabel);

    for (const type of activeTypes) {
      const lane = document.createElement("div");
      lane.className = "lane";

      // 同じ年・同じラインの作品は日付順に並べ、
      // 絶対座標ではなく通常のフローで縦に積み上げる。
      // これにより作品数が多い年でもカード同士が重ならず、
      // 行の高さは中身に合わせて自動的に広がる。
      const laneWorks = works
        .filter(w => {
          if (w.type !== type) return false;
          const n = dateToNumber(w.date);
          return n >= year && n < year + 1;
        })
        .sort((a, b) => dateToNumber(a.date) - dateToNumber(b.date));

      for (const work of laneWorks) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = `work ${type}`;
        card.dataset.id = work.id;

        card.innerHTML = `
          <div class="work-title">${escapeHtml(work.title)}</div>
          <div class="work-date">${escapeHtml(work.date)}</div>
        `;

        card.addEventListener("click", () => openModal(work));
        lane.appendChild(card);
      }

      row.appendChild(lane);
    }

    body.appendChild(row);
  }
}
function openModal(work) {
  document.getElementById("modalTitle").textContent = work.title;
  document.getElementById("modalMeta").textContent =
    `${TYPE_NAMES[work.type]} / ${work.date}`;
  document.getElementById("modalDescription").textContent =
    work.description || "";

  const wikiButton = document.getElementById("wikiButton");

  if (work.url) {
    wikiButton.href = work.url;
    wikiButton.style.display = "inline-block";
  } else {
    wikiButton.removeAttribute("href");
    wikiButton.style.display = "none";
  }

  document.getElementById("modalBackdrop").classList.add("show");
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("show");
}

document.querySelectorAll(".toggle").forEach(button => {
  button.addEventListener("click", () => {
    const type = button.dataset.type;
    visible[type] = !visible[type];
    button.classList.toggle("active", visible[type]);
    render();
  });
});

document.getElementById("closeModal").addEventListener("click", closeModal);

document.getElementById("modalBackdrop").addEventListener("click", event => {
  if (event.target.id === "modalBackdrop") closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

async function loadData() {
  try {
    const response = await fetch(DATA_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const json = await response.json();

    if (!Array.isArray(json.works)) {
      throw new Error("JSONに works 配列がありません。");
    }

    // JSON取得成功 → JSONの値を使用
    works = json.works;

    console.log(`作品データ: JSONを使用 (${works.length}件)`);
  } catch (error) {
    // JSON取得失敗 → HTML直書きデータを使用
    works = FALLBACK_WORKS;

    console.warn(
      "作品データ: HTML直書きのフォールバックを使用",
      error
    );
  }

  render();
}
loadData();
</script>
