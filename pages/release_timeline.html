<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アサルトリリィ 作品公開順タイムライン</title>
<style>
  :root {
    --bg: #fffafb;
    --panel: #ffffff;
    --text: #4b4350;
    --muted: #8d818d;
    --line: #e7dfe7;
    --stage: #e0568f;
    --anime: #5472d3;
    --game: #2b9e8a;
    --novel: #d98a3d;
    --other: #8a8a96;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo,
                 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
  }

  body { overflow-x: hidden; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,252,253,.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #eadfe6;
    padding: 10px 12px;
    box-shadow: 0 3px 18px rgba(112,73,101,.06);
  }

  .brand {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: baseline;
    gap: 13px;
    max-width: 1180px;
    margin: 0 auto 13px;
    padding-left: 4px;
  }

  h1 {
    margin: 0;
    color: #4c3f49;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(25px, 3vw, 34px);
    font-weight: 500;
    letter-spacing: .02em;
  }

  .brand-rule {
    position: absolute;
    left: 8px;
    right: 25%;
    bottom: -8px;
    height: 1px;
    background: linear-gradient(90deg, rgba(213,106,156,.65), rgba(213,106,156,.08), transparent);
  }

  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    max-width: 1180px;
    margin: 0 auto;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid #d9cbd7;
    background: rgba(255,255,255,.92);
    color: #625666;
    border-radius: 999px;
    padding: 4px 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 2px 6px rgba(102,72,96,.04);
    transition: .15s ease;
  }

  .toggle:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(102,72,96,.10);
  }

  .toggle.active {
    color: #fff;
    border-color: transparent;
  }

  .toggle[data-type="stage"].active { background: var(--stage); }
  .toggle[data-type="anime"].active { background: var(--anime); }
  .toggle[data-type="game"].active { background: var(--game); }
  .toggle[data-type="novel"].active { background: var(--novel); }
  .toggle[data-type="other"].active { background: var(--other); }

  .toggle:not(.active) {
    color: #9b909a;
    background: #f7f3f7;
  }

  .type-icon {
    width: 16px;
    height: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 16px;
  }

  .type-icon svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hint {
    color: var(--muted);
    font-size: 11px;
    margin-left: 5px;
  }

  .viewport {
    position: relative;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 4px 40px;
  }

  .timeline {
    position: relative;
    z-index: 1;
    width: 100%;
    background: rgba(255,255,255,.96);
    border: 1px solid #e5dce5;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(104,76,98,.08);
  }

  .header {
    position: relative;
    z-index: 20;
    display: grid;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }

  .header > div {
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--line);
    font-weight: 800;
    padding: 2px;
  }

  .header > div:last-child { border-right: 0; }

  .year-label {
    color: #a66f8d;
    font-size: 15px;
  }

  .lane-title {
    gap: 4px;
    font-size: 14px;
    letter-spacing: .02em;
    text-align: center;
  }

  .lane-title .title-copy {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.1;
  }

  .lane-title .en {
    margin-top: 1px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .05em;
    opacity: .72;
  }

  .lane-title.stage {
    background: color-mix(in srgb, var(--stage) 18%, white);
    color: color-mix(in srgb, var(--stage) 62%, black);
  }
  .lane-title.anime {
    background: color-mix(in srgb, var(--anime) 18%, white);
    color: color-mix(in srgb, var(--anime) 62%, black);
  }
  .lane-title.game {
    background: color-mix(in srgb, var(--game) 18%, white);
    color: color-mix(in srgb, var(--game) 62%, black);
  }
  .lane-title.novel {
    background: color-mix(in srgb, var(--novel) 18%, white);
    color: color-mix(in srgb, var(--novel) 62%, black);
  }
  .lane-title.other {
    background: color-mix(in srgb, var(--other) 18%, white);
    color: color-mix(in srgb, var(--other) 62%, black);
  }

  .body {
    position: relative;
  }

  .year-row {
    position: relative;
    display: grid;
    align-items: stretch;
    border-bottom: 1px solid #e8e1e8;
  }

  .year-row:last-child { border-bottom: 0; }

  .year {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 8px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(11px, 2.5vw, 16px);
    font-weight: 600;
    color: #a65f82;
    background: #fffafd;
    border-right: 1px solid var(--line);
  }

  .lane {
    position: relative;
    padding: 2px;
    border-right: 1px solid #eee7ee;
    min-width: 0;
  }
  .lane:last-child { border-right: 0; }

  /* カード共通 */
  .work {
    position: absolute;
    left: 2px;
    right: 2px;
    z-index: 3;
    padding: 3px 3px 4px;
    border: 1px solid #ddd4de;
    border-left: 3px solid var(--type-color);
    border-radius: 5px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(93,70,91,.08);
    cursor: pointer;
    text-align: left;
    transition: transform .12s, box-shadow .12s, z-index .12s;
    overflow: hidden;
  }

  .work:hover {
    transform: scale(1.04);
    box-shadow: 0 4px 12px rgba(93,70,91,.2);
    z-index: 10;
  }

  .work-title {
    font-size: 10px;
    line-height: 1.15;
    font-weight: 700;
    color: #4e4650;
    word-break: break-all;
  }

  /* 画像ラッパー (複数対応) */
  .work-images-container {
    display: flex;
    gap: 2px;
    width: 100%;
    margin-bottom: 2px;
  }

   /* 拡大時に枠からはみ出さないようラッパー要素を調整 */
   .work-image-wrapper {
     flex: 1;
     min-width: 0;
     height: 38px;
     overflow: hidden; /* 拡大した画像を枠内で切り抜き */
     border-radius: 3px;
     position: relative;
  }

  .work-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
    transition: transform .15s ease;
  }

  .work-date {
    margin-top: 1px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 9px;
    color: #9a8d98;
    letter-spacing: 0;
    line-height: 1;
  }

  .lane.stage { --type-color: var(--stage); background: rgba(224,86,143,.05); }
  .lane.anime { --type-color: var(--anime); background: rgba(84,114,211,.05); }
  .lane.game { --type-color: var(--game); background: rgba(43,158,138,.05); }
  .lane.novel { --type-color: var(--novel); background: rgba(217,138,61,.05); }
  .lane.other { --type-color: var(--other); background: rgba(138,138,150,.05); }

  .legend {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 4px 0;
    color: #817681;
    font-size: 11px;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .empty {
    color: #999;
    text-align: center;
    padding: 40px 20px;
    font-size: 13px;
  }

  /* モーダル */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.45);
  }

  .modal-backdrop.show { display: flex; }

  .modal {
    width: min(500px, 100%);
    max-height: 85vh;
    overflow: auto;
    background: #fffafd;
    border: 1px solid #e5d7e2;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    padding: 16px;
  }

  .modal h2 {
    margin: 0 0 8px;
    font-size: 16px;
    line-height: 1.3;
  }

  .modal .modal-image-wrap {
    margin: 10px 0;
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .modal .modal-image {
    display: block;
    max-width: 100%;
    max-height: 220px;
    object-fit: contain;
    border-radius: 6px;
    flex: 1;
    min-width: 0;
  }

  .modal .modal-date {
    margin-bottom: 10px;
    color: #777;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12px;
  }

  .modal .note-label {
    margin-bottom: 4px;
    color: #8d7185;
    font-size: 11px;
    font-weight: 800;
  }

  .modal .description {
    line-height: 1.6;
    font-size: 13px;
    white-space: pre-wrap;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  .modal-actions button,
  .modal-actions a {
    display: inline-block;
    border: 0;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    text-decoration: none;
    font-size: 12px;
  }

  .close-btn { background: #eee; color: #333; }
  .wiki-btn { background: #333; color: #fff; }

  /* スマホでの超小幅対応 (360px以下) */
  @media (max-width: 480px) {
    .header > div { min-height: 38px; }
    .lane-title .en { display: none; }
    .work { padding: 3px 2px; }
    .work-title { font-size: 9px; }
    .work-image { height: 30px; }
    .work-date { font-size: 8px; }
  }
</style>
</head>

<main class="viewport">

</main>

<div id="modalBackdrop" class="modal-backdrop">

      <a class="wiki-btn" id="wikiButton" target="_blank" rel="noopener">ページを開く</a>

  </div>
</div>

function dateToNumber(date) {
  let year, month = 1, day = 1;

  if (typeof date === "string" && date.includes("年")) {
    // 「YYYY年M月D日」または「YYYY年M月」形式を解析
    const match = date.match(/(\d{4})年(?:(\d{1,2})月)?(?:(\d{1,2})日)?/);
    if (match) {
      year = parseInt(match[1], 10);
      if (match[2]) month = parseInt(match[2], 10);
      if (match[3]) day = parseInt(match[3], 10);
    }
  } else if (typeof date === "string" && date.includes("-")) {
    // 従来の「YYYY-MM-DD」形式も引き続きサポート
    const parts = date.split("-").map(Number);
    year = parts[0];
    month = parts[1] || 1;
    day = parts[2] || 1;
  } else {
    year = parseInt(date, 10);
  }

  if (!year || isNaN(year)) return 0;

  // その年の中での位置を 0〜1 に近似
  const daysInYear = new Date(year, 11, 31).getDate() === 31 ? 365 : 366;
  const start = new Date(year, 0, 1);
  const current = new Date(year, month - 1, day);
  const elapsed = Math.max(0, current - start) / 86400000;

  return year + elapsed / daysInYear;
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* カードの高さを計算・推測 */
function estimateCardHeight(work) {
  const isMobile = window.innerWidth <= 480;
  const hasImg = !!(work.cardImage || work.image);

  // スマホ表示では画像高さ30px（CSSの指定に合わせる）
  const baseImgHeight = hasImg ? (isMobile ? 32 : 40) : 0;

  // タイトルの長さから折り返し行数を推定
  // スマホの狭いレーン幅では1行あたり6〜8文字程度で折り返されるため条件分岐
  const titleLength = work.title ? work.title.length : 0;
  const charsPerLine = isMobile ? 7 : 12;
  const lines = Math.max(1, Math.ceil(titleLength / charsPerLine));

  const titleLineHeight = isMobile ? 11 : 12;
  const titleHeight = lines * titleLineHeight;

  const dateHeight = isMobile ? 9 : 11; // 日付の高さ
  const padding = isMobile ? 8 : 10;    // パディング＋余白

  return baseImgHeight + titleHeight + dateHeight + padding;
}

function render() {
  body.innerHTML = "";

  const activeTypes = TYPES.filter(type => visible[type]);

  // ヘッダー再生成
  const header = document.querySelector(".header");
  header.innerHTML = "";

  const yearHeader = document.createElement("div");
  yearHeader.className = "year-label";
  header.appendChild(yearHeader);

  for (const type of activeTypes) {
    const title = document.createElement("div");
    title.className = `lane-title ${type}`;
    title.innerHTML = `
      <span class="type-icon">${TYPE_ICONS[type]}</span>
      <span class="title-copy">
        <span>${TYPE_NAMES[type]}</span>
        <span class="en">${TYPE_EN[type]}</span>
      </span>
    `;
    header.appendChild(title);
  }

  // スマホでも全列均等配分（年表示欄のみ小さめの固定幅）
  const yearColWidth = window.innerWidth <= 480 ? "36px" : "48px";
  const gridTemplate = `${yearColWidth} repeat(${activeTypes.length}, minmax(0, 1fr))`;
  header.style.gridTemplateColumns = gridTemplate;

  const activeWorks = works.filter(w => activeTypes.includes(w.type));

  if (activeWorks.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "表示できる作品がありません。";
    body.appendChild(empty);
    return;
  }

  const activeYears = activeWorks.map(w => Math.floor(dateToNumber(w.date)));
  const startYear = Math.min(...activeYears);
  const endYear = Math.max(...activeYears);

  const BASE_YEAR_HEIGHT = 100;

  for (let year = startYear; year <= endYear; year++) {
    const row = document.createElement("div");
    row.className = "year-row";
    row.style.gridTemplateColumns = gridTemplate;

    const yearLabel = document.createElement("div");
    yearLabel.className = "year";
    yearLabel.textContent = year;
    row.appendChild(yearLabel);

    // 1. その年のカードを「全レーン混ざった状態」で抽出＆日付順にソート
    const currentYearWorks = works
      .filter(w => activeTypes.includes(w.type))
      .filter(w => {
        const n = dateToNumber(w.date);
        return n >= year && n < year + 1;
      })
      .sort((a, b) => dateToNumber(a.date) - dateToNumber(b.date));

    // 2. 年全体の配置トラッキング用変数
    let globalLastBottom = 0; // 全レーンを通じた最後のカードの下端
    const laneLastBottom = {}; // レーンごとの最後のカードの下端
    activeTypes.forEach(t => laneLastBottom[t] = 0);

    // カードごとの配置位置を保存するリスト
    const placedCards = [];

    // 3. 日付順に上から順にY位置（top）を決めていく
    for (const work of currentYearWorks) {
      const yearProgress = dateToNumber(work.date) - year;
      const cardH = estimateCardHeight(work);

      // 日付比率に基づいた理想的なTop位置
      let targetTop = 6 + yearProgress * (BASE_YEAR_HEIGHT - cardH - 12);

      // 【重要】時系列を綺麗に見せるため：
      // 「直前の日付のカード（全レーン）」の下端より上には配置しない
      if (targetTop < globalLastBottom + 4) {
        targetTop = globalLastBottom + 4;
      }

      // 同じレーン内でカードが重なるのも防ぐ
      if (targetTop < laneLastBottom[work.type] + 4) {
        targetTop = laneLastBottom[work.type] + 4;
      }

      const bottom = targetTop + cardH;
      laneLastBottom[work.type] = bottom;
      globalLastBottom = bottom; // 時系列基準の位置を更新

      placedCards.push({ work, top: targetTop });
    }

    // 行の高さを設定（最低高さ or 最後のカードの下端 + 余白）
    const rowHeight = Math.max(BASE_YEAR_HEIGHT, globalLastBottom + 10);
    row.style.height = `${rowHeight}px`;

    // 4. 各レーンエレメントを作成してカードをDOMに追加
    for (const type of activeTypes) {
      const lane = document.createElement("div");
      lane.className = `lane ${type}`;

      // このレーンに所属するカードを取得
      const laneCards = placedCards.filter(item => item.work.type === type);

      for (const cardData of laneCards) {
        const { work, top } = cardData;
        const card = document.createElement("button");
        card.type = "button";
        card.className = `work ${type}`;
        card.dataset.id = work.id;

        const displayImg1 = work.cardImage || work.image;
        const displayImg2 = work.cardImage2 || work.image2;

        const imgPos1 = work.imagePosition ? escapeHtml(work.imagePosition) : 'center';
        const imgPos2 = work.image2Position ? escapeHtml(work.image2Position) : imgPos1;
        const imgScale = work.imageScale ? Number(work.imageScale) : 1;

        // transformとtransform-originで拡大・拡大軸を適用
        const style1 = `width: 100%; height: 100%; object-fit: cover; object-position: ${imgPos1}; transform: scale(${imgScale}); transform-origin: ${imgPos1};`;
        const style2 = `width: 100%; height: 100%; object-fit: cover; object-position: ${imgPos2}; transform: scale(${imgScale}); transform-origin: ${imgPos2};`;

        let imgHtml = "";
        if (displayImg1) {
          if (displayImg2) {
            imgHtml = `
              <div class="work-images-container">
                <div class="work-image-wrapper">
                  <img class="work-image" src="${escapeHtml(displayImg1)}" style="${style1}" alt="" loading="lazy">
                </div>
                <div class="work-image-wrapper">
                  <img class="work-image" src="${escapeHtml(displayImg2)}" style="${style2}" alt="" loading="lazy">
                </div>
              </div>`;
          } else {
            imgHtml = `
              <div class="work-images-container">
                <div class="work-image-wrapper">
                  <img class="work-image" src="${escapeHtml(displayImg1)}" style="${style1}" alt="" loading="lazy">
                </div>
              </div>`;
          }
        }

        card.innerHTML = `
          ${imgHtml}
          <div class="work-title">${escapeHtml(work.title)}</div>
          <div class="work-date">${escapeHtml(work.date)}</div>
        `;

        card.style.top = `${top}px`;
        card.addEventListener("click", () => openModal(work));
        lane.appendChild(card);
      }

      row.appendChild(lane);
    }

    body.appendChild(row);
  }
}
function openModal(work) {
  document.getElementById("modalTitle").textContent = work.title;

  const modalImageWrap = document.getElementById("modalImageWrap");
  modalImageWrap.innerHTML = "";

  if (work.image) {
    const img1 = document.createElement("img");
    img1.className = "modal-image";
    img1.src = work.image;
    img1.alt = work.title;
    modalImageWrap.appendChild(img1);

    if (work.image2) {
      const img2 = document.createElement("img");
      img2.className = "modal-image";
      img2.src = work.image2;
      img2.alt = work.title;
      modalImageWrap.appendChild(img2);
    }

    modalImageWrap.style.display = "flex";
  } else {
    modalImageWrap.style.display = "none";
  }

  document.getElementById("modalDate").textContent = work.date;
  document.getElementById("modalDescription").textContent = work.description || "";

  const wikiButton = document.getElementById("wikiButton");

  if (work.url) {
    wikiButton.href = work.url;
    wikiButton.style.display = "inline-block";
  } else {
    wikiButton.removeAttribute("href");
    wikiButton.style.display = "none";
  }

  document.getElementById("modalBackdrop").classList.add("show");
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("show");
}

document.querySelectorAll(".toggle").forEach(button => {
  button.addEventListener("click", () => {
    const type = button.dataset.type;
    visible[type] = !visible[type];
    button.classList.toggle("active", visible[type]);
    render();
  });
});

document.getElementById("closeModal").addEventListener("click", closeModal);

document.getElementById("modalBackdrop").addEventListener("click", event => {
  if (event.target.id === "modalBackdrop") closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

async function loadData() {
  try {
    const response = await fetch(DATA_URL, { cache: "no-store" });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const json = await response.json();

    if (!Array.isArray(json.works)) {
      throw new Error("JSONに works 配列がありません。");
    }

    // JSON取得成功 → JSONの値を使用
    works = json.works;

    console.log(`作品データ: JSONを使用 (${works.length}件)`);
  } catch (error) {
    // JSON取得失敗 → HTML直書きデータを使用
    works = FALLBACK_WORKS;

    console.warn(
      "作品データ: HTML直書きのフォールバックを使用",
      error
    );
  }

  render();
}

window.addEventListener("resize", render);
loadData();
</script>
