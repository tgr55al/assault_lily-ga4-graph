<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閲覧数推移</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#1f2536;
    --paper:#fbfaf7;
    --line:#e4e1d8;
    --accent:#3388ff;   /* 日別閲覧者数グラフと統一した青 */
    --accent-soft:#cfe1ff;
    --sub:#6b7280;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
  }
  .card{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:12px 14px 10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    min-height:100px;
  }
  .head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .head .label{
    font-size:12px;
    letter-spacing:.08em;
    color:var(--sub);
  }
  .head .total{
    font-family:var(--mono);
    font-size:20px;
    font-weight:700;
    color:var(--accent);
  }
  .head .total span{
    font-size:11px;
    font-weight:400;
    color:var(--sub);
    margin-left:3px;
  }
  .chart-wrap{
    position:relative;
    flex:1;
    min-height:60px;
  }
  .msg{
    font-size:12px;
    color:var(--sub);
    padding:8px 2px;
  }
  .footer{
    font-size:10px;
    color:var(--sub);
    text-align:right;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="label">累計閲覧数</div>
      <div class="total" id="total">—</div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
    <div class="msg" id="msg" style="display:none;"></div>
    <div class="footer" id="updated"></div>
  </div>

<script>
const verticalLinePlugin = {
  id: 'verticalLinePlugin',
  afterDraw(chart) {
    const { ctx, chartArea, tooltip } = chart;

    if (!tooltip || !tooltip._active || !tooltip._active.length) return;

    const activePoint = tooltip._active[0].element;
    const x = activePoint.x;

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x, chartArea.top);
    ctx.lineTo(x, chartArea.bottom);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.stroke();
    ctx.restore();
  }
};
Chart.register(verticalLinePlugin);

// ── 設定 ──────────────────────────────────────────
// pageviews_by_page.json の場所（同一リポジトリのGitHub Pages上）
const DATA_URL = "./pageviews_by_page.json";
// 直近何日分をグラフに出すか（累計は全期間で計算）
const RECENT_DAYS = 30;
// ─────────────────────────────────────────────────

function normalizePath(p) {
  if (!p) return "";
  p = p.split("?")[0].split("#")[0];
  if (p.length > 1) p = p.replace(/\/+$/, "");
  return p || "/";
}

function getTargetPath() {
  const params = new URLSearchParams(location.search);
  const raw = params.get("path");
  if (raw) return normalizePath(raw);

  // path指定がない場合、埋め込み元(親フレーム)のURLから自動推測を試みる。
  // クロスオリジンのためdocument.referrerのpathnameのみ利用可能。
  try {
    if (document.referrer) {
      const refUrl = new URL(document.referrer);
      return normalizePath(refUrl.pathname);
    }
  } catch (e) { /* 無視 */ }

  return null;
}

function showMessage(text) {
  const msg = document.getElementById("msg");
  msg.textContent = text;
  msg.style.display = "block";
}

async function main() {
  const path = getTargetPath();

  if (!path) {
    showMessage("表示するページを特定できませんでした（?path=/pages/xx.html を指定してください）");
    return;
  }

  let data;
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("fetch failed");
    data = await res.json();
  } catch (e) {
    showMessage("閲覧数データの取得に失敗しました");
    return;
  }

  const series = data[path];
  if (!series || Object.keys(series).length === 0) {
    showMessage("このページの閲覧数データはまだありません");
    return;
  }

  const dates = Object.keys(series).sort();
  const total = dates.reduce((sum, d) => sum + series[d], 0);

  document.getElementById("total").innerHTML =
    total.toLocaleString() + '<span>views</span>';

  const recentDates = dates.slice(-RECENT_DAYS);
  const recentValues = recentDates.map(d => series[d]);
  const labels = recentDates.map(d => d.slice(5)); // MM-DD表示

  const ctx = document.getElementById("chart").getContext("2d");
  new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: recentValues,
        borderColor: "#3388ff",
        backgroundColor: "rgba(51, 136, 255, 0.1)",
        borderWidth: 2,
        pointRadius: 0,
        pointHoverRadius: 0,
        tension: 0,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: "index" },
      plugins: {
        legend: { display: false },
        title: { display: false },
        tooltip: {
          backgroundColor: 'rgba(255,255,255,0.95)',
          titleColor: '#000',
          bodyColor: '#000',
          borderWidth: 0,
          usePointStyle: false,
          displayColors: false,
          intersect: false,
          mode: 'index',
          callbacks: {
            title: (items) => recentDates[items[0].dataIndex],
            label: (item) => `閲覧数: ${item.formattedValue} (views)`
          }
        }
      },
      scales: {
        x: {
          title: { display: false },
          ticks: { font: { size: 9 }, color: "#6b7280", maxRotation: 0, autoSkip: true, maxTicksLimit: 6 },
          grid: { display: false }
        },
        y: {
          beginAtZero: true,
          title: { display: false },
          ticks: { font: { size: 9 }, color: "#6b7280", maxTicksLimit: 4 },
          grid: { color: "#e4e1d8" }
        }
      }
    }
  });

  document.getElementById("updated").textContent =
    `更新: ${dates[dates.length - 1]}（直近${recentDates.length}日間を表示）`;
}

main();
</script>
</body>
</html>
