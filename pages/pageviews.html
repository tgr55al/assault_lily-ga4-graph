<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>アサルトリリィwiki ページ別閲覧者数グラフ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        body, html { margin:0; padding:0; height:100%; font-family: system-ui, sans-serif; }
        #container { width:100%; height:100vh; padding:20px; box-sizing:border-box; }
        canvas { max-width:100%; max-height:100%; }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="chart"></canvas>
    </div>

    <script>
        const verticalLinePlugin = {
            id: 'verticalLinePlugin',
            afterDraw(chart) {
                const { ctx, chartArea, tooltip } = chart;

                if (!tooltip || !tooltip._active || !tooltip._active.length) return;

                const activePoint = tooltip._active[0].element;
                const x = activePoint.x;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x, chartArea.top);
                ctx.lineTo(x, chartArea.bottom);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.stroke();
                ctx.restore();
            }
        };

        Chart.register(verticalLinePlugin);
//test
        // ── 設定 ──────────────────────────────────────────
        // pageviews_by_page.json の場所（同一リポジトリのGitHub Pages上）
        const DATA_URL = 'pageviews_by_page.json';
        // ─────────────────────────────────────────────────

        function normalizePath(p) {
            if (!p) return "";
            p = p.split("?")[0].split("#")[0];
            if (p.length > 1) p = p.replace(/\/+$/, "");
            return p || "/";
        }

        function getTargetPath() {
            const params = new URLSearchParams(location.search);
            const raw = params.get("path");
            if (raw) return normalizePath(raw);

            // path指定がない場合、埋め込み元(親フレーム)のURLから自動推測を試みる。
            // クロスオリジンのためdocument.referrerのpathnameのみ利用可能。
            try {
                if (document.referrer) {
                    const refUrl = new URL(document.referrer);
                    return normalizePath(refUrl.pathname);
                }
            } catch (e) { /* 無視 */ }

            return null;
        }

        function showError(message) {
            document.getElementById('container').innerHTML =
                `<p style="color:red;padding:20px;">${message}</p>`;
        }

        const path = getTargetPath();

        if (!path) {
            showError('表示するページを特定できませんでした（?path=/pages/xx.html を指定してください）');
        } else {
            fetch(DATA_URL + '?' + Date.now())
                .then(r => {
                    if (!r.ok) throw new Error('fetch failed');
                    return r.json();
                })
                .then(data => {
                    const series = data[path];
                    if (!series || Object.keys(series).length === 0) {
                        showError('このページの閲覧者数データはまだありません');
                        return;
                    }

                    const dates = Object.keys(series).sort();
                    const values = recentDates.map(d => series[d]);

                    new Chart(document.getElementById('chart'), {
                      type: 'line',
                      data: {
                        labels: dates,
                        datasets: [{
                          label: '閲覧者数',
                          data: values,
                          borderColor: '#3388ff',
                          backgroundColor: 'rgba(51, 136, 255, 0.1)',
                          borderWidth: 2,
                          tension: 0,
                          pointRadius: 0,
                          pointHoverRadius: 0
                        }]
                      },
                      options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                          legend: { display: false },
                          title: { display: false },
                          interaction: {
                            mode: 'index',
                            intersect: false
                          },
                          tooltip: {
                            backgroundColor: 'rgba(255,255,255,0.95)',
                            titleColor: '#000',
                            bodyColor: '#000',
                            borderWidth: 0,
                            usePointStyle: false,
                            displayColors: false,
                            intersect: false,
                            mode: 'index',
                            callbacks: {
                              title: function(tooltipItems) {
                                return tooltipItems[0]?.label ?? "";
                              },
                              label: function(context) {
                                const value = context.formattedValue ?? (context.parsed && context.parsed.y) ?? context.raw;
                                return `閲覧者数: ${value} (viewers)`;
                              }
                            }
                          }
                        },
                        scales: {
                          x: { title: { display: false }, grid: { display: false } },
                          y: { beginAtZero: true, title: { display: false } }
                        }
                      }
                    });
                })
                .catch(() => {
                    showError('pageviews_by_page.jsonの読み込みに失敗しました');
                });
        }
    </script>
</body>
</html>
